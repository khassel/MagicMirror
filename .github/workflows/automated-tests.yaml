# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: "Run Automated Tests"

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # strategy:
    #   matrix:
    #     image: [arm32v7/node:18-bullseye]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Qemu
        uses: dbhi/qus/action@main
        with:
          targets: arm aarch64
      - name: Install dependencies and run tests
        # uses: 'docker://${{ matrix.arch }}/node:${{ matrix.node-version }}-bullseye'
        uses: docker://arm64v8/node:18-bullseye
        with:
          args: /bin/bash -c "./.github/workflows/run_mm_tests"
          # args: /bin/bash -c "uname -a && cat /etc/os-release && Xvfb :99 -screen 0 1024x768x16 & && export DISPLAY=:99 && npm run install-mm:dev && touch css/custom.css && npm run test:prettier && npm run test:js && npm run test:css && npm run test"
